version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    labels:
      - dependencies
      - docker
