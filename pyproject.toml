[project]
name = "fastapi-cloud-run-template"
version = "0.1.0"
description = "API-only FastAPI template for GCP Cloud Run with Grafana Cloud observability."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "streamlit>=1.42.0",
    "google-generativeai>=0.8.0",
    "google-api-core>=2.24.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.14.0,<1.0.0",
]



[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "T201",
]
ignore = [
    "B008",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
