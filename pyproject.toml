[project]
name = "fastapi-cloud-run-template"
version = "0.1.0"
description = "API-only FastAPI template for GCP Cloud Run with Grafana Cloud observability."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.124.0,<1.0.0",
    "opentelemetry-api>=1.39.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1.0.0",
    "opentelemetry-sdk>=1.39.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.60b0,<1.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "T201",
]
ignore = [
    "B008",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
